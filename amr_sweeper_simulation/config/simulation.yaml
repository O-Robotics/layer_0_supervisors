simulation:
  default_profile: empty1
  world_name: empty1
  world_file: empty1.sdf
  entity_name: amr_sweeper
  georeference:
    latitude_deg: 56.164520029
    longitude_deg: 10.1453534275
    elevation_m: 100.0
    heading_deg: 0.0
  spawn_pose:
    x: 0.0
    y: 0.0
    z: 0.15
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  profiles:
    empty1:
      world_name: empty1
      world_file: empty1.sdf
      mission_id: empty1
      schedule_ics_path: missions/database/simulations/empty1.ics
      spawn_pose:
        x: -5.0
        y: -4.75
        z: 0.15
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    test_city:
      world_name: test_city
      world_file: test_city.sdf
      mission_id: test_city
      schedule_ics_path: missions/database/simulations/test_city.ics
      spawn_pose:
        x: 33.0
        y: 13.0
        z: 0.15
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    medium_city:
      world_name: medium_city
      world_file: medium_city.sdf
      mission_id: medium_city
      schedule_ics_path: missions/database/simulations/medium_city.ics
      spawn_pose:
        x: -49.8
        y: -49.7
        z: 0.15
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    small_city:
      world_name: small_city
      world_file: small_city.sdf
      mission_id: small_city
      schedule_ics_path: missions/database/simulations/small_city.ics
      spawn_pose:
        x: 26.66
        y: -27.38
        z: 0.15
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    large_city:
      world_name: large_city
      world_file: large_city.sdf
      mission_id: large_city
      schedule_ics_path: missions/database/simulations/large_city.ics
      spawn_pose:
        x: 22.46
        y: -97.78
        z: 0.15
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
  gnss:
    navsat_topic: gnss/navsat
    gpsfix_topic: gnss/fix
    odometry_topic: gnss/odometry
    status_marker_topic: gnss/status_marker
    rtcm_topic: ntrip_client/rtcm
    frame_id: gnss_link
    publish_rate_hz: 5.0
    noise_correlation_tau_s: 12.0
    autonomous_noise_h_m: 1.25
    autonomous_noise_v_m: 2.5
    dgps_noise_h_m: 0.7
    dgps_noise_v_m: 1.3
    rtk_float_noise_h_m: 0.45
    rtk_float_noise_v_m: 0.9
    rtk_fixed_noise_h_m: 0.3
    rtk_fixed_noise_v_m: 0.6
    min_horizontal_stddev_m: 0.75
    min_vertical_stddev_m: 1.5
    horizontal_covariance_scale: 4.0
    vertical_covariance_scale: 4.0
    autonomous_satellites: 10
    corrected_satellites: 14
    correction_timeout_s: 3.0
    dgps_warmup_s: 2.0
    rtk_float_warmup_s: 8.0
    simulated_ntrip_publish_rate_hz: 1.0
    simulated_ntrip_startup_delay_s: 1.5

bridges:
  - ros_topic_name: /clock
    gz_topic_name: /clock
    ros_type_name: rosgraph_msgs/msg/Clock
    gz_type_name: gz.msgs.Clock
    direction: GZ_TO_ROS
  - ros_topic_name: simulation/imu/data_raw
    gz_topic_name: /gazebo/imu/data_raw
    ros_type_name: sensor_msgs/msg/Imu
    gz_type_name: gz.msgs.IMU
    direction: GZ_TO_ROS
  - ros_topic_name: simulation/depth_camera/image_rect_raw
    gz_topic_name: /gazebo/depth_camera/image_rect_raw
    ros_type_name: sensor_msgs/msg/Image
    gz_type_name: gz.msgs.Image
    direction: GZ_TO_ROS
  - ros_topic_name: simulation/depth_camera/camera_info
    gz_topic_name: /gazebo/depth_camera/camera_info
    ros_type_name: sensor_msgs/msg/CameraInfo
    gz_type_name: gz.msgs.CameraInfo
    direction: GZ_TO_ROS
  - ros_topic_name: simulation/robot_pose
    gz_topic_name: /model/{entity_name}/pose
    ros_type_name: geometry_msgs/msg/PoseStamped
    gz_type_name: gz.msgs.Pose
    direction: GZ_TO_ROS
  - ros_topic_name: sweeping_controller/cmd_vel_drive
    gz_topic_name: /gazebo/sweeping_controller/cmd_vel_drive
    ros_type_name: geometry_msgs/msg/Twist
    gz_type_name: gz.msgs.Twist
    direction: ROS_TO_GZ
  - ros_topic_name: /world/{world_name}/pose/info
    gz_topic_name: /world/{world_name}/pose/info
    ros_type_name: tf2_msgs/msg/TFMessage
    gz_type_name: gz.msgs.Pose_V
    direction: GZ_TO_ROS
