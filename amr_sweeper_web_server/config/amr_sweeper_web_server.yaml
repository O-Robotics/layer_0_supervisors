###############################################################################
# AMR Sweeper Web Server - Example Netplan
#
# Purpose
#   - Documents the expected robot-side static IP used by the operator web UI
#   - Assumes the Jetson connects to the router over Ethernet
#   - Assumes operators connect through the router's Wi-Fi network
###############################################################################

network:
  version: 2
  renderer: NetworkManager

  # Robot uplink to the router. The router then bridges or routes traffic from
  # Wi-Fi clients to this static robot address.
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - 192.168.2.1/24
