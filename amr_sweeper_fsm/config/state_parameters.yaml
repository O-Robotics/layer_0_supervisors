###############################################################################
# AMR Sweeper FSM - State Parameters
#
# Purpose
#   - Defines FSM-supervisor topics and publish rate 
#   - Defines FSM-state *fault handling* 
#   - Defines FSM-state profile file 
###############################################################################

/**/supervisor_node:
  ros__parameters:
    publish:
      rules:
        - "topic=fsm/supervisor/fsm_state;type=amr_sweeper_fsm/msg/FSMState;period_ms=1000;source=state"
        - "topic=fsm/supervisor/fsm_status;type=amr_sweeper_fsm/msg/FSMStatus;period_ms=1000;source=status"


#################################### INITIALIZING ####################################
/**/INITIALIZING_node:
  ros__parameters:
    ready:
      controller_query_timeout_ms: 5000   # Timeout for each controller_manager hardware/controller probe during startup.
      lifecycle_query_timeout_ms: 3000    # Timeout for each lifecycle get_state probe during bringup.

    # FSM-state faults evaluated continuously while the FSM-state is active.
    faults:
      fault_priority: 250
      fault_force: true
      rosout_triggers:
        - "level>=FATAL;action=FAULT"
        - "node=INITIALIZING_node;level>=ERROR;action=FAULT"

    # Valid profile range: 000 - 099
    profiles:
      default_profile_id: 001
      file: "config/profiles/initializing_profiles.yaml"


