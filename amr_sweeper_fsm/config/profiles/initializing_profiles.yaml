###############################################################################
# INITIALIZING - Profiles
#
# This file contains all profiles valid for the INITIALIZING FSM-state.
# Valid profile range: 000 - 099
###############################################################################

profiles:

  # ---------------------------------------------------------------------------
  # Profile 000 (FSM tester)
  # ---------------------------------------------------------------------------
  - profile:
      id: 000
      transitions:
        auto_transition_on: true
        auto_transition_profile: 100
        fault_transition_on: true
        fault_transition_profile: 400

      processes:
        # Logic block: FSM tester node (critical)
        - name: "fsm_tester"
          importance: "critical"
          startup:
            exec: "ros2 run amr_sweeper_fsm fsm_tester_node"
            args:
              - "--ros-args -r __ns:=/{ns}"
            ready:
              - type: "topic"
                target: "{ns}/fsm_tester"
                required: true
              - type: "service"
                target: "{ns}/fsm_tester_node/apply_parameters"
                required: true
            window_ms: 5000
          rosout_triggers:
            - "node=fsm_tester_node;level>=ERROR;action=FAULT"
            - "node=fsm_tester_node_node;level>=WARN;action=DEGRADED"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000


  # ---------------------------------------------------------------------------
  # Profile 001 (default)
  # ---------------------------------------------------------------------------
  - profile:
      id: 001
      transitions:
        auto_transition_on: true
        auto_transition_profile: 101
        fault_transition_on: true
        fault_transition_profile: 400

      processes:
        # Logic block: layer_1_hardware bringup (critical)
        - name: "amr_sweeper_layer_1_hardware_bringup"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_layer_1_hardware_bringup amr_sweeper_layer_1_hardware_bringup.launch.py"
            args:
              - "namespace:={ns}"
              - "use_amr_sweeper_battery:=true"
              - "use_amr_sweeper_system_info:=true"
              - "use_amr_sweeper_usb_cameras:=true"
              - "use_amr_sweeper_depth_camera:=false"
              - "use_amr_sweeper_imu:=true"
              - "use_amr_sweeper_gnss:=true"
              - "use_ntrip_client:=true"
            ready:
              - type: "topic"
                target: "system_info"
                required: true
              - type: "service"
                target: "amr_sweeper_battery_node/get_parameters"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "node=amr_sweeper_system_info_node;level>=ERROR;action=FAULT"
            - "node=amr_sweeper_system_info_node;level>=WARN;action=DEGRADED"
            - "node=amr_sweeper_system_info_node;match=Could not open file;action=FAULT"
            - "node=amr_sweeper_battery_node;level>=ERROR;action=FAULT"
            - "node=amr_sweeper_battery_node;level>=WARN;action=DEGRADED"
            - "level>=ERROR;match=Failed to open V4L2 device;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000

        # Logic block: layer_2_controllers bringup (critical)
        - name: "amr_sweeper_layer_2_controllers_bringup"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_layer_2_controllers_bringup amr_sweeper_layer_2_controllers_bringup.launch.py"
            args:
              - "namespace:={ns}"
              - "use_amr_sweeper_joystick:=false"
              - "use_amr_sweeper_sweeping_controller:=true"
              - "use_amr_sweeper_wheel_controller:=true"
              - "use_amr_sweeper_tool_controller:=true"
              - "use_amr_sweeper_attitude_controller:=true"
              - "use_amr_sweeper_safety_controller:=true"
            ready:
              - type: "topic"
                target: "cmd_vel_sweep_wheels"
                required: true
              - type: "topic"
                target: "controller_steadydrive/commands"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "level>=FATAL;action=FAULT"
            - "level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 0
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1500
            sigterm_timeout_ms: 1500
            sigkill_timeout_ms: 1500

        # Logic block: layer_3_navigation bringup (critical)
        - name: "amr_sweeper_layer_3_navigation_bringup"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_layer_3_navigation_bringup amr_sweeper_layer_3_navigation_bringup.launch.py"
            args:
              - "namespace:={ns}"
              - "use_sim_time:=false"
              - "use_amr_sweeper_localization:=true"
              - "use_amr_sweeper_mapping:=true"
              - "use_amr_sweeper_waypoint_follower:=true"
            ready:
              - type: "topic"
                target: "odometry/fused"
                required: true
              - type: "service"
                target: "controller_server/get_state"
                required: true
              - type: "service"
                target: "amr_sweeper_mapping_node/get_parameters"
                required: true
            window_ms: 15000
          rosout_triggers:
            - "level>=FATAL;action=FAULT"
            - "level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 2000
            sigterm_timeout_ms: 2000
            sigkill_timeout_ms: 2000

        # Logic block: mission builder (critical)
        - name: "amr_sweeper_vda5050_parser"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_vda5050_parser mission_parser.launch.py"
            args:
              - "namespace:={ns}"
              - "use_sim_time:=false"
              - "missions_directory:=src/missions"
              - "auto_build_on_start:=true"
              - "watch_for_updates:=true"
            ready:
              - type: "service"
                target: "mission_parser_node/get_parameters"
                required: true
              - type: "service"
                target: "build_current_mission"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "node=mission_parser_node;level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000

        # Logic block: scheduler (critical)
        - name: "amr_sweeper_scheduler"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_scheduler scheduler.launch.py"
            args:
              - "namespace:={ns}"
              - "use_sim_time:=false"
              - "missions_directory:=src/missions"
              - "robot_id:=RBT-01"
              - "trigger_running_on_work_window:=false"
            ready:
              - type: "service"
                target: "reload_schedule"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "node=amr_sweeper_scheduler;level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000
      


  # ---------------------------------------------------------------------------
  # Profile 002
  # ---------------------------------------------------------------------------
  - profile:
      id: 002
      transitions:
        auto_transition_on: false
        auto_transition_profile: 
        fault_transition_on: true
        fault_transition_profile: 400

      processes:
        # Logic block: layer_1_hardware bringup (critical)
        - name: "amr_sweeper_layer_1_hardware_bringup"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_layer_1_hardware_bringup amr_sweeper_layer_1_hardware_bringup.launch.py"
            args:
              - "namespace:={ns}"
              - "use_amr_sweeper_battery:=true"
              - "use_amr_sweeper_system_info:=true"
              - "use_amr_sweeper_usb_cameras:=true"
              - "use_amr_sweeper_depth_camera:=true"
              - "use_amr_sweeper_imu:=true"
              - "use_amr_sweeper_gnss:=true"
              - "use_ntrip_client:=true"
            #args:
            #  - "--ros-args"
            #  - "-r __ns:=/{ns}"
            #ready:
              #- type: "service"
              #  target: "{ns}/amr_sweeper_battery_node/get_parameters"
              #  required: true
            #window_ms: 5000
          rosout_triggers:
            - "node=amr_sweeper_layer_1_hardware_bringup;level>=ERROR;action=FAULT"
            - "node=robot_state_publisher;level>=ERROR;action=FAULT"
            - "node=battery;level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000
