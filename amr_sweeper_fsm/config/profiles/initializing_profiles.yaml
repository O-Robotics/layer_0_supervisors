###############################################################################
# INITIALIZING - Profiles
#
# This file contains all profiles valid for the INITIALIZING FSM-state.
# Valid profile range: 000 - 099
###############################################################################

profiles:

  # ---------------------------------------------------------------------------
  # Profile 000 (bridge)
  # ---------------------------------------------------------------------------
  - profile:
      id: 000
      transitions:
        auto_transition_on: true
        auto_transition_profile: 100
        fault_transition_on: true
        fault_transition_profile: 400

      processes: []


  # ---------------------------------------------------------------------------
  # Profile 001 (default)
  # ---------------------------------------------------------------------------
  - profile:
      id: 001
      transitions:
        auto_transition_on: true
        auto_transition_profile: 101
        fault_transition_on: true
        fault_transition_profile: 400

      processes:
        # Logic block: mission builder (critical)
        - name: "amr_sweeper_vda5050_parser"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_vda5050_parser amr_sweeper_vda5050_parser.launch.py"
            args:
              - "namespace:={ns}"
              - "use_sim_time:=false"
              - "missions_directory:=missions/database"
              - "auto_build_on_start:=true"
              - "watch_for_updates:=true"
            ready:
              - type: "service"
                target: "vda5050_parser_node/get_parameters"
                required: true
              - type: "service"
                target: "build_current_mission"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "node=vda5050_parser_node;level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000

        # Logic block: scheduler (critical)
        - name: "scheduler_node"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_scheduler amr_sweeper_scheduler.launch.py"
            args:
              - "namespace:={ns}"
              - "use_sim_time:=false"
              - "missions_directory:=missions/database"
              - "trigger_running_on_work_window:=false"
            ready:
              - type: "service"
                target: "reload_schedule"
                required: true
            window_ms: 8000
          rosout_triggers:
            - "node=scheduler_node;level>=ERROR;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000

        # Logic block: layer_1_hardware bringup (critical)
        - name: "amr_sweeper_layer_1_hardware_bringup"
          importance: "critical"
          startup:
            exec: "ros2 launch amr_sweeper_layer_1_hardware_bringup amr_sweeper_layer_1_hardware_bringup.launch.py"
            args:
              - "namespace:={ns}"
              - "use_amr_sweeper_ros2_control:=true"
              - "use_amr_sweeper_battery:=true"
              - "use_amr_sweeper_system_info:=true"
              - "use_amr_sweeper_usb_cameras:=true"
              - "use_amr_sweeper_depth_camera:=true"
              - "use_amr_sweeper_imu:=true"
              - "use_amr_sweeper_gnss:=true"
              - "use_ntrip_client:=true"
            ready:
              - type: "topic"
                target: "system_info/system_info"
                required: true
              - type: "topic"
                target: "imu/data_raw"
                required: true
              - type: "topic"
                target: "imu/data_acc_gyro"
                required: true
              - type: "topic"
                target: "imu/data_heading"
                required: true
              - type: "topic"
                target: "gnss/navsat"
                required: true
              - type: "topic"
                target: "battery/battery_state"
                required: true
              - type: "topic"
                target: "usb_cameras/rear_left_camera/image_raw/compressed"
                required: true
              - type: "topic"
                target: "usb_cameras/rear_right_camera/image_raw/compressed"
                required: true
              - type: "topic"
                target: "usb_cameras/tools_camera/image_raw/compressed"
                required: true
              - type: "topic"
                target: "depth_camera/depth/camera_info"
                required: true
              - type: "topic"
                target: "depth_camera/scan"
                required: true
              - type: "topic"
                target: "depth_camera/depth/color/points"
                required: false
              - type: "service"
                target: "robot_state_publisher/get_parameters"
                required: true
              - type: "service"
                target: "battery/battery_node/get_parameters"
                required: true
              - type: "service"
                target: "system_info/system_info_node/get_parameters"
                required: true
              - type: "service"
                target: "imu/imu_node/get_parameters"
                required: true
              - type: "service"
                target: "gnss/gnss_node/get_parameters"
                required: true
              - type: "service"
                target: "gnss/ntrip_client_node/get_parameters"
                required: true
              - type: "hardware"
                target: "odrive_ros2_control"
                state: "active"
                required: true
              - type: "hardware"
                target: "steadydrive_ros2_control"
                state: "active"
                required: true
              - type: "controller"
                target: "joint_broad"
                required: true
            window_ms: 45000
          rosout_triggers:
            - "node=system_info_node;level>=ERROR;action=FAULT"
            - "node=system_info_node;level>=WARN;action=DEGRADED"
            - "node=system_info_node;match=Could not open file;action=FAULT"
            - "node=battery_node;level>=ERROR;action=FAULT"
            - "node=battery_node;level>=WARN;action=DEGRADED"
            - "node=depth_camera_watchdog;level>=ERROR;action=DEGRADED"
            - "node=depth_camera_watchdog;level>=WARN;action=DEGRADED"
            - "level>=ERROR;match=Failed to open V4L2 device;action=FAULT"
          errors:
            on_readiness_fail: "FAULT"
            on_unexpected_exit: "FAULT"
            priority: 250
            force: true
          restart:
            max_restarts: 5
            restart_delay_ms: 1000
          shutdown:
            sigint_timeout_ms: 1000
            sigterm_timeout_ms: 1000
            sigkill_timeout_ms: 1000

