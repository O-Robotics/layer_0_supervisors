                required: true
              - type: "topic"
                target: "attitude_controller/joint_states"
                required: true
              - type: "topic"
                target: "drive_controller/odom"
                required: true
              - type: "topic"
                target: "safety_controller/status"
                required: true
              - type: "topic"
                target: "collision_detector/impact_detected"
                required: true
              - type: "service"
                target: "amr_sweeper_attitude_controller/enable_attitude_estimation"
                required: true
              - type: "service"
                target: "amr_sweeper_safety_controller/enable_controller"
                required: true
              - type: "service"
                target: "amr_sweeper_collision_detector/enable_detector"
                required: true
              - type: "controller"
                target: "drive_controller"
                required: true
              - type: "controller"
